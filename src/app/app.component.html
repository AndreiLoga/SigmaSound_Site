<a class="skip-link" href="#main-content">{{ 'Sari la conținut' | t }}</a>
<header class="site-header" (keydown.escape)="onMenuEscape($event)" (focusout)="onHeaderFocusOut($event)">
  <a class="brand" routerLink="/" aria-label="Sigma Sound" (click)="closeMenu()">
    <img src="assets/poze galerie/poze icon/logo.svg" alt="" width="132" height="40">
  </a>
  <div class="language-switch" role="group" [attr.aria-label]="'Limba site-ului' | t">
    <button type="button" lang="ro" aria-label="Română" [attr.aria-pressed]="locale.language() === 'ro'" (click)="locale.language.set('ro')">RO</button>
    <button type="button" lang="en" aria-label="English" [attr.aria-pressed]="locale.language() === 'en'" (click)="locale.language.set('en')">EN</button>
  </div>
  <button #menuToggle class="menu-toggle" type="button" aria-controls="primary-nav" [attr.aria-expanded]="menuOpen" [attr.aria-label]="(menuOpen ? 'Închide meniul' : 'Deschide meniul') | t" (click)="toggleMenu()"><span aria-hidden="true">{{ menuOpen ? '×' : '☰' }}</span></button>
  <nav id="primary-nav" [class.is-open]="menuOpen" [attr.aria-label]="'Navigare principală' | t">
    <a routerLink="/" fragment="servicii" (click)="closeMenu()">{{ 'Servicii' | t }}</a>
    <a routerLink="/galerie" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">{{ 'Galerie' | t }}</a>
    <a routerLink="/" fragment="contact" (click)="closeMenu()">{{ 'Contact' | t }}</a>
  </nav>
</header>

<router-outlet></router-outlet>

<footer>
  <div class="footer-brand"><span>Sigma Sound</span><span>{{ 'Scenă · Sunet · Lumini' | t }}</span></div>
  <nav class="footer-links" [attr.aria-label]="'Informații legale' | t">
    <a routerLink="/confidentialitate">{{ 'Confidențialitate' | t }}</a>
    <a routerLink="/cookies">{{ 'Cookies și stocare' | t }}</a>
    <a routerLink="/informatii-legale">{{ 'Informații legale' | t }}</a>
    <a href="https://anpc.ro/" target="_blank" rel="noopener noreferrer">ANPC <span class="sr-only">{{ '(tab nou)' | t }}</span></a>
  </nav>
</footer>
