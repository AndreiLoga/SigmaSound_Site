<main class="portfolio-page scroll-reveal-page" id="main-content" tabindex="-1">
  <h1 appScrollReveal="up">{{ 'Galerie' | t }}</h1>
    <div class="event-list">
      <section class="event-gallery" *ngFor="let event of events; let eventIndex = index" [id]="event.id" [attr.aria-labelledby]="event.id + '-title'">
        <header class="event-heading" appScrollReveal="left">
          <div>
            <h2 [id]="event.id + '-title'" lang="ro">{{ event.title }} <span>{{ event.year || '' }}</span></h2>
          </div>
        </header>
        <div class="mobile-gallery" [appScrollReveal]="eventIndex % 2 === 0 ? 'right' : 'left'" role="group" [attr.aria-label]="event.title + ' ' + event.year" (keydown)="onEventGalleryKey($event, event)">
          <figure class="event-feature">
            <button type="button" class="featured-photo" [id]="event.id + '-featured'" (click)="openPhoto(event, activeIndex(event), $event)" aria-haspopup="dialog" [attr.aria-label]="('Mărește' | t) + ': ' + photoLabel(event, activeIndex(event))">
              <img [src]="activePhoto(event).thumbnail" [attr.srcset]="photoSources(activePhoto(event))" sizes="calc(100vw - 40px)" [alt]="photoLabel(event, activeIndex(event))" [width]="activePhoto(event).imageWidth" [height]="activePhoto(event).imageHeight" loading="lazy" decoding="async">
            </button>
            <figcaption class="gallery-navigation">
              <button *ngIf="event.photos.length > 1" class="gallery-arrow" type="button" (click)="moveEventPhoto(event, -1)" [attr.aria-controls]="event.id + '-featured'" [attr.aria-label]="'Imaginea anterioară' | t">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m14 6-6 6 6 6"/></svg>
              </button>
              <span class="gallery-position" aria-live="polite">{{ 'Fotografia' | t }} <strong>{{ activeIndex(event) + 1 }}</strong> / {{ event.photos.length }}</span>
              <button *ngIf="event.photos.length > 1" class="gallery-arrow" type="button" (click)="moveEventPhoto(event, 1)" [attr.aria-controls]="event.id + '-featured'" [attr.aria-label]="'Imaginea următoare' | t">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m10 6 6 6-6 6"/></svg>
              </button>
            </figcaption>
          </figure>
          <div class="event-thumbnails" *ngIf="event.photos.length > 1" role="group" [attr.aria-label]="'Alege fotografia' | t">
            <button type="button" class="event-thumbnail" *ngFor="let photo of event.photos; let index = index" [class.active]="index === activeIndex(event)" [attr.aria-pressed]="index === activeIndex(event)" [attr.tabindex]="index === activeIndex(event) ? 0 : -1" [attr.aria-controls]="event.id + '-featured'" [attr.aria-label]="('Vezi fotografia' | t) + ': ' + photoLabel(event, index)" (click)="selectEventPhoto(event, index)">
              <img [src]="photo.thumbnail" alt="" [width]="photo.width" [height]="photo.height" loading="lazy" decoding="async">
            </button>
          </div>
        </div>
        <div class="photo-grid desktop-gallery" [appScrollReveal]="eventIndex % 2 === 0 ? 'right' : 'left'">
          <button type="button" class="photo-button" *ngFor="let photo of event.photos; let index = index" (click)="openPhoto(event, index, $event)" aria-haspopup="dialog" [attr.aria-label]="('Mărește' | t) + ': ' + photoLabel(event, index)">
            <img [src]="photo.thumbnail" [class.uncropped]="photo.uncropped" [alt]="photoLabel(event, index)" loading="lazy" decoding="async" [width]="photo.width" [height]="photo.height">
          </button>
        </div>
      </section>
    </div>
  <dialog #lightbox class="lightbox" aria-labelledby="photo-caption" aria-describedby="gallery-help" (close)="onClose()" (keydown)="onLightboxKey($event)">
    <ng-container *ngIf="selectedEvent as event">
      <div class="lightbox-toolbar">
        <p id="gallery-help">{{ 'Folosește săgețile pentru navigare și Esc pentru închidere.' | t }}</p>
        <button type="button" autofocus (click)="closePhoto()">{{ 'Închide galeria' | t }} <span aria-hidden="true">×</span></button>
      </div>
      <figure>
        <img [src]="event.photos[selectedIndex].image" [alt]="photoLabel(event, selectedIndex)" [width]="event.photos[selectedIndex].imageWidth" [height]="event.photos[selectedIndex].imageHeight" (error)="imageFailed = true" [hidden]="imageFailed">
        <p *ngIf="imageFailed" role="alert">{{ 'Fotografia nu poate fi încărcată.' | t }} <a [href]="event.photos[selectedIndex].image" target="_blank" rel="noopener">{{ 'Deschide fotografia separat' | t }}</a></p>
        <figcaption id="photo-caption" aria-live="polite">{{ photoLabel(event, selectedIndex) }} / {{ event.photos.length }}</figcaption>
      </figure>
      <div class="lightbox-controls">
        <button type="button" (click)="movePhoto(-1)" [disabled]="event.photos.length < 2">{{ 'Imaginea anterioară' | t }}</button>
        <button type="button" (click)="movePhoto(1)" [disabled]="event.photos.length < 2">{{ 'Imaginea următoare' | t }}</button>
      </div>
    </ng-container>
  </dialog>
</main>
