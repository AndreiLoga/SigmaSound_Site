<main class="portfolio-page">
  <section class="portfolio-hero">
    <div>
      <h1>Evenimente realizate împreună cu Sigma Sound.</h1>
    </div>
    <a class="button secondary" routerLink="/" fragment="contact">Cere ofertă</a>
  </section>

  <section class="portfolio-shell">
    <div class="portfolio-feature" aria-live="polite" aria-atomic="true" id="selected-event">
      <img [src]="selectedImage.image" [alt]="selectedImage.title">
      <div>
        <p>{{ selectedImage.category }}</p>
        <h2>{{ selectedImage.title }}</h2>
      </div>
    </div>

    <div class="portfolio-grid">
      <button
        type="button"
        *ngFor="let item of portfolio; trackBy: trackByTitle"
        [class.active]="item === selectedImage"
        [attr.aria-pressed]="item === selectedImage"
        aria-controls="selected-event"
        (click)="selectImage(item)">
        <img [src]="item.thumbnail" alt="" loading="lazy" decoding="async" width="480" height="320">
        <span>{{ item.title }}</span>
      </button>
    </div>
  </section>
</main>
