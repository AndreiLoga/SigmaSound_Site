<main class="portfolio-page" id="main-content" tabindex="-1">
  <section class="portfolio-hero">
    <div>
      <h1>{{ 'Evenimente realizate împreună cu Sigma Sound.' | t }}</h1>
    </div>
    <a class="button secondary" routerLink="/" fragment="contact">{{ 'Cere ofertă' | t }}</a>
  </section>

  <section class="portfolio-shell">
    <div class="portfolio-feature" aria-live="polite" aria-atomic="true" id="selected-event">
      <img [src]="selectedImage.image" [alt]="selectedImage.title | t">
      <div>
        <p>{{ selectedImage.category | t }}</p>
        <h2>{{ selectedImage.title | t }}</h2>
      </div>
    </div>

    <div class="portfolio-grid">
      <button
        type="button"
        *ngFor="let item of portfolio; trackBy: trackByTitle"
        [class.active]="item === selectedImage"
        [attr.aria-pressed]="item === selectedImage"
        aria-controls="selected-event"
        (click)="selectImage(item)">
        <img [src]="item.thumbnail" alt="" loading="lazy" decoding="async" width="480" height="320">
        <span>{{ item.title | t }}</span>
      </button>
    </div>
  </section>
</main>
