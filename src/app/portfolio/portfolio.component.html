<main class="portfolio-page">
  <section class="portfolio-hero">
    <div>
      <p class="eyebrow">Portofoliu</p>
      <h1>Evenimente, scene și show-uri lucrate de Sigma Sound.</h1>
      <p>Am scos galeria din prima pagină ca site-ul să fie mai aerisit. Aici putem adăuga treptat mai multe lucrări, pe măsură ce alegem pozele cele mai bune.</p>
    </div>
    <a class="button secondary" routerLink="/" fragment="contact">Cere ofertă</a>
  </section>

  <section class="portfolio-shell">
    <div class="portfolio-feature">
      <img [src]="selectedImage.image" [alt]="selectedImage.title">
      <div>
        <p>{{ selectedImage.category }}</p>
        <h2>{{ selectedImage.title }}</h2>
      </div>
    </div>

    <div class="portfolio-grid">
      <button
        type="button"
        *ngFor="let item of portfolio; trackBy: trackByTitle"
        [class.active]="item === selectedImage"
        (click)="selectImage(item)">
        <img [src]="item.image" [alt]="item.title">
        <span>{{ item.title }}</span>
      </button>
    </div>
  </section>
</main>
