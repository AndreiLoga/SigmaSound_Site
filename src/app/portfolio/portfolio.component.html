<main class="portfolio-page" id="main-content" tabindex="-1">
  <h1>{{ 'Portofoliu' | t }}</h1>
    <div class="event-list">
      <section class="event-gallery" *ngFor="let event of events" [id]="event.id" [attr.aria-labelledby]="event.id + '-title'">
        <header class="event-heading">
          <div>
            <h2 [id]="event.id + '-title'" lang="ro">{{ event.title }} <span>{{ event.year || ('[TODO: anul evenimentului]' | t) }}</span></h2>
          </div>
        </header>
        <div class="photo-grid">
          <button type="button" class="photo-button" *ngFor="let photo of event.photos; let index = index" (click)="openPhoto(event, index, $event)" aria-haspopup="dialog" [attr.aria-label]="('Mărește' | t) + ': ' + photoLabel(event, index)">
            <img [src]="photo.thumbnail" [alt]="photoLabel(event, index)" loading="lazy" decoding="async" [width]="photo.width" [height]="photo.height">
          </button>
        </div>
      </section>
    </div>
  <dialog #lightbox class="lightbox" aria-labelledby="photo-caption" aria-describedby="gallery-help" (close)="onClose()" (keydown)="onLightboxKey($event)">
    <ng-container *ngIf="selectedEvent as event">
      <div class="lightbox-toolbar">
        <p id="gallery-help">{{ 'Folosește săgețile pentru navigare și Esc pentru închidere.' | t }}</p>
        <button type="button" autofocus (click)="closePhoto()">{{ 'Închide galeria' | t }} <span aria-hidden="true">×</span></button>
      </div>
      <figure>
        <img [src]="event.photos[selectedIndex].image" [alt]="photoLabel(event, selectedIndex)" [width]="event.photos[selectedIndex].imageWidth" [height]="event.photos[selectedIndex].imageHeight" (error)="imageFailed = true" [hidden]="imageFailed">
        <p *ngIf="imageFailed" role="alert">{{ 'Fotografia nu poate fi încărcată.' | t }} <a [href]="event.photos[selectedIndex].image" target="_blank" rel="noopener">{{ 'Deschide fotografia separat' | t }}</a></p>
        <figcaption id="photo-caption" aria-live="polite">{{ photoLabel(event, selectedIndex) }} / {{ event.photos.length }}</figcaption>
      </figure>
      <div class="lightbox-controls">
        <button type="button" (click)="movePhoto(-1)" [disabled]="event.photos.length < 2">{{ 'Imaginea anterioară' | t }}</button>
        <button type="button" (click)="movePhoto(1)" [disabled]="event.photos.length < 2">{{ 'Imaginea următoare' | t }}</button>
      </div>
    </ng-container>
  </dialog>
</main>
